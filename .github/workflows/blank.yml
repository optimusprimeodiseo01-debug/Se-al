El término "Eigen_tapiz" parece referirse al nombre de usuario o seudónimo de un autor o creador de contenido, específicamente identificado como Ivan, quien publica historias y artículos en la plataforma Medium. 
No existe una definición estándar en el arte o la decoración para esta combinación de palabras. Sin embargo, por separado significan lo siguiente:
Eigen: Es una palabra de origen alemán que significa "propio", "característico" o "particular". En matemáticas y física, se usa como prefijo para conceptos como eigenvector (vector propio).
Tapiz: Se refiere a una obra de tejido grueso, generalmente con figuras o escenas, que se cuelga en las paredes como adorno. También se usa el término "papel tapiz" para revestimientos decorativos de paredes. 

